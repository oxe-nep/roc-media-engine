bind: "0.0.0.0:8080"
recordings_dir: "./recordings"
preview_dir: "./preview"
hls_dir: "./hls"
public_host: "127.0.0.1"
max_nvenc_sessions: 8
default_encode_preset: hq

encode_presets:
  proxy:
    label: "Proxy 4 Mbit"
    video_codec: nvh264enc
    video_bitrate: "4M"
    video_maxrate: "5M"
    video_bufsize: "8M"
    video_preset: low-latency-hq
    video_gop: 50
    audio_bitrate: "128k"
    audio_channels: 2
  hq:
    label: "HQ 12 Mbit"
    video_codec: nvh264enc
    video_bitrate: "12M"
    video_maxrate: "14M"
    video_bufsize: "20M"
    video_preset: low-latency-hq
    video_gop: 50
    audio_bitrate: "192k"
    # 2 = stereo (default). 8 = four AAC pairs — deferred until REC/SRT stable.
    audio_channels: 2
  mezz:
    label: "Mezz 20 Mbit"
    video_codec: nvh264enc
    video_bitrate: "20M"
    video_maxrate: "24M"
    video_bufsize: "40M"
    video_preset: hq
    video_gop: 50
    audio_bitrate: "256k"
    audio_channels: 2
  hq_hevc:
    label: "HQ HEVC 8 Mbit"
    video_codec: nvh265enc
    video_bitrate: "8M"
    video_maxrate: "10M"
    video_bufsize: "16M"
    video_preset: low-latency-hq
    video_gop: 50
    audio_bitrate: "192k"
    audio_channels: 2
  mezz_hevc:
    label: "Mezz HEVC 14 Mbit"
    video_codec: nvh265enc
    video_bitrate: "14M"
    video_maxrate: "16M"
    video_bufsize: "28M"
    video_preset: hq
    video_gop: 50
    audio_bitrate: "256k"
    audio_channels: 2
  dnxhd_sq:
    label: "DNxHD SQ"
    video_codec: avenc_dnxhd
    video_bitrate: "120M"
    video_preset: sq
    video_gop: 1
    audio_bitrate: "384k"
    audio_channels: 8
  dnxhd_hq:
    label: "DNxHD HQ"
    video_codec: avenc_dnxhd
    video_bitrate: "185M"
    video_preset: hq
    video_gop: 1
    audio_bitrate: "384k"
    audio_channels: 8
  dnxhd_hqx:
    label: "DNxHD HQX (10-bit)"
    video_codec: avenc_dnxhd
    video_bitrate: "185M"
    video_preset: hqx
    video_gop: 1
    audio_bitrate: "384k"
    audio_channels: 8
  xavc_intra_hd:
    label: "XAVC Intra HD"
    video_codec: xavc_intra
    video_bitrate: "111M"
    video_preset: intra
    video_gop: 1
    audio_bitrate: "384k"
    audio_channels: 8

channels:
  - id: 1
    name: "Channel 1"
    encode_preset: hq
    # Optional: REC can differ from live/proxy (e.g. dnxhd_185). Defaults to encode_preset.
    # record_preset: dnxhd_185
    device: "DeckLink IP 100G (1)"
    mode: "auto"
    udp_egress: "udp://239.255.28.1:21001?pkt_size=1316&reuse=1&ttl=1"
