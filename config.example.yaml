bind: "0.0.0.0:8090"
recordings_dir: "./recordings"
preview_dir: "./preview"
max_nvenc_sessions: 8
default_encode_preset: hq

encode_presets:
  proxy:
    label: "Proxy 4 Mbit"
    video_codec: nvh264enc
    video_bitrate: "4M"
    video_maxrate: "5M"
    video_bufsize: "8M"
    video_preset: low-latency-hq
    video_gop: 50
    audio_bitrate: "128k"
    audio_channels: 2
  hq:
    label: "HQ 12 Mbit"
    video_codec: nvh264enc
    video_bitrate: "12M"
    video_maxrate: "14M"
    video_bufsize: "20M"
    video_preset: low-latency-hq
    video_gop: 50
    audio_bitrate: "192k"
    audio_channels: 2
  mezz:
    label: "Mezz 20 Mbit"
    video_codec: nvh264enc
    video_bitrate: "20M"
    video_maxrate: "24M"
    video_bufsize: "40M"
    video_preset: hq
    video_gop: 50
    audio_bitrate: "256k"
    audio_channels: 2
  hq_hevc:
    label: "HQ HEVC 8 Mbit"
    video_codec: nvh265enc
    video_bitrate: "8M"
    video_maxrate: "10M"
    video_bufsize: "16M"
    video_preset: low-latency-hq
    video_gop: 50
    audio_bitrate: "192k"
    audio_channels: 2
  mezz_hevc:
    label: "Mezz HEVC 14 Mbit"
    video_codec: nvh265enc
    video_bitrate: "14M"
    video_maxrate: "16M"
    video_bufsize: "28M"
    video_preset: hq
    video_gop: 50
    audio_bitrate: "256k"
    audio_channels: 2

