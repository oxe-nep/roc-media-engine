# roc-media-engine – k3s frontend
# Public host kept: recording.nepsweden.tech
# Image built by CI: ghcr.io/oxe-nep/roc-media-engine-frontend:latest
# nginx proxies to BACKEND_HOST:BACKEND_PORT (engine on :8080).

---
# Placeholder only — live cluster keeps API_KEY via kubectl; do not overwrite
# an existing roc-media-engine-secrets with this example value.
apiVersion: v1
kind: Secret
metadata:
  name: roc-media-engine-secrets
type: Opaque
stringData:
  API_KEY: "change-me"
  BACKEND_HOST: "10.199.28.249"
  BACKEND_PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roc-media-engine-frontend
  labels:
    app: roc-media-engine-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: roc-media-engine-frontend
  template:
    metadata:
      labels:
        app: roc-media-engine-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: frontend
          image: ghcr.io/oxe-nep/roc-media-engine-frontend:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: roc-media-engine-secrets
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: roc-media-engine-frontend
spec:
  selector:
    app: roc-media-engine-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: roc-media-engine-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`recording.nepsweden.tech`)
      kind: Rule
      services:
        - name: roc-media-engine-frontend
          port: 80
      middlewares:
        - name: https-redirect
          namespace: default

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: roc-media-engine-https
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`recording.nepsweden.tech`)
      kind: Rule
      services:
        - name: roc-media-engine-frontend
          port: 80
  tls:
    certResolver: letsencrypt
