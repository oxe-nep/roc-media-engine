[package]
name = "roc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Control plane: axum API + channel orchestrator"

[[bin]]
name = "roc-media-engine"
path = "src/main.rs"

[features]
default = []
gst = ["roc-pipelines/gst"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
roc-config.workspace = true
roc-devices.workspace = true
roc-pipelines = { path = "../roc-pipelines", default-features = false }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
